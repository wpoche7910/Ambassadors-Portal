<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ambassadors Portal</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--text:#1c2430;--muted:#5b6676;--line:#d9dfe8;--brand:#1f3a5f;--accent:#2b6cb0;
--ok-bg:#e3f4ea;--ok-text:#1b6b3a;--warn-bg:#fff1d6;--warn-text:#8a5300;--bad:#b42318;--shadow:0 1px 2px rgba(20,30,50,.06),0 1px 8px rgba(20,30,50,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--surface:#1a212b;--text:#e8ecf2;--muted:#9aa5b5;--line:#2c3644;--brand:#0f2744;--accent:#7db3f0;
--ok-bg:#173a27;--ok-text:#8fdcab;--warn-bg:#43310f;--warn-text:#f5c870;--bad:#ff8a80;--shadow:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}h1{font-size:1.7rem;margin:.2rem 0 .6rem;line-height:1.2}h2{font-size:1.15rem;margin:0 0 .7rem}h3{font-size:1rem;margin:1rem 0 .3rem}
code{background:var(--bg);padding:.1rem .3rem;border-radius:4px;word-break:break-all}
.page{max-width:1080px;margin:0 auto;padding:1.25rem 16px 3rem}.muted{color:var(--muted)}.small{font-size:.875rem}.right{text-align:right}.nowrap{white-space:nowrap}
.topbar{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10}
.bar{max-width:1080px;margin:0 auto;padding:.5rem 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{color:#fff;font-weight:700;text-decoration:none;font-size:1.1rem;margin-right:.5rem}
.nav{display:flex;flex-wrap:wrap;gap:.15rem;align-items:center}
.nav a,.nav button{color:#dbe6f5;text-decoration:none;padding:.45rem .7rem;border-radius:8px;font-size:.95rem;background:none;border:0;cursor:pointer;font-family:inherit}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.nav a.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.menu-toggle{display:none;margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;padding:.5rem .9rem;border-radius:8px;font:inherit;cursor:pointer}
@media (max-width:900px){.menu-toggle{display:inline-block}.nav{display:none;flex-direction:column;align-items:stretch;width:100%;padding-bottom:.5rem}.nav.open{display:flex}.nav a,.nav button{padding:.7rem .8rem;text-align:left;width:100%}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin:0 0 1rem;box-shadow:var(--shadow)}
.narrow{max-width:620px}.auth{max-width:420px;margin:8vh auto 0}
.row{display:flex;align-items:center}.row.gap{gap:.6rem}.row.between{justify-content:space-between;gap:.75rem}.row.wrap{flex-wrap:wrap}.row.end{align-items:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start}@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}@media (max-width:560px){.two{grid-template-columns:1fr}}
.hero{padding:1rem 0 .5rem}.hero h1{font-size:2rem;margin-bottom:.1rem}.lead{font-size:1.2rem;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin:1rem 0}
.stat{display:flex;flex-direction:column;text-decoration:none;color:var(--text);margin:0}.stat .num{font-size:2rem;font-weight:700;color:var(--brand);line-height:1.1}
@media (prefers-color-scheme:dark){.stat .num{color:var(--accent)}}
.field{display:flex;flex-direction:column;gap:.25rem;margin:0 0 .85rem;font-weight:600;font-size:.92rem}.field .muted{font-weight:400}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem;width:100%;min-height:44px}
textarea{min-height:90px}input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.check{display:flex;align-items:center;gap:.55rem;margin:.3rem 0;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.btn.primary{background:#2b5d9b;border-color:#2b5d9b}}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.block{width:100%}.btn.small{min-height:36px;padding:.25rem .7rem;font-size:.875rem}.btn[disabled]{opacity:.5;cursor:not-allowed}
.linklike{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
.table th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.table tr:last-child td{border-bottom:0}
.table input:not([type=checkbox]),.table select{min-height:38px;padding:.3rem .5rem}
.list{list-style:none;padding:0;margin:0}.list li{padding:.5rem 0;border-bottom:1px solid var(--line);display:flex;gap:.6rem;flex-wrap:wrap;align-items:baseline}.list li:last-child{border-bottom:0}
.pick{list-style:none;padding:.3rem .6rem;margin:0 0 .8rem;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;columns:2}@media (max-width:560px){.pick{columns:1}}.pick li{break-inside:avoid}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-text);border-color:transparent}.badge.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:.7rem 1.1rem;border-radius:10px;z-index:50;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#toast.bad{background:var(--bad);color:#fff}
.flash{padding:.7rem 1rem;border-radius:10px;margin:0 0 1rem;background:var(--ok-bg);color:var(--ok-text);font-weight:500}.flash.bad{background:var(--warn-bg);color:var(--bad)}
.link-card{border-color:var(--accent)}.copy{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.month-nav{margin:.8rem 0}.month-nav h2{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0;overflow:hidden;gap:1px;background:var(--line)}
.cal-head{background:var(--bg);text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);padding:.4rem 0}
.cal-cell{background:var(--surface);min-height:96px;padding:.3rem;display:flex;flex-direction:column;gap:3px;min-width:0}.cal-cell.other{background:var(--bg)}.cal-cell.other .cal-day{opacity:.5}
.cal-day{font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;align-self:flex-start;padding:0 .3rem;border-radius:6px}.cal-cell.today .cal-day{background:var(--brand);color:#fff}
.chip-ev{display:block;font-size:.75rem;line-height:1.25;background:var(--ok-bg);color:var(--ok-text);padding:2px 5px;border-radius:5px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-list{display:none}@media (max-width:700px){.cal{display:none}.month-list{display:block}}
</style>
</head>
<body>
<div id="app"><p class="page muted">Loading…</p></div>
<div id="toast" hidden></div>
<noscript><p class="page">This portal needs JavaScript turned on.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ===== 1. YOUR SUPABASE DETAILS (see SETUP.md). The publishable key is designed to be public. ===== */
var SUPABASE_URL = "https://ddespbbhsmkmoywoladj.supabase.co";
var SUPABASE_KEY = "sb_publishable_UuKWpspmdCZmNSPwkh3uzg_nQMgrSz3";
/* =============================================================================================== */

var MIN_PW = 10;
var ROLES = { officer: "Officer", setup: "Set-up", main: "Main", participant: "Participant" };
var ROLE_ORDER = { officer: 0, setup: 1, main: 2, participant: 3 };
var REMINDER = { not_sent: "Not sent", sent: "Sent", confirmed: "Confirmed" };

var sb = null, session = null, staff = null, recovering = false, gmConfigured = null;
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function opts(map, cur) { return Object.keys(map).map(function (k) { return '<option value="' + esc(k) + '"' + (k === cur ? " selected" : "") + ">" + esc(map[k]) + "</option>"; }).join(""); }

/* ---------- small helpers ---------- */
var toastTimer;
function toast(msg, bad) { var t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 6000 : 2200); }
function fail(e) { console.error(e); toast((e && e.message) || "Something went wrong", true); }
async function q(p) { var r = await p; if (r.error) throw new Error(r.error.message); return r.data; }
async function all(table, cols, order) {
  var out = [], from = 0;
  for (;;) { var d = await q(sb.from(table).select(cols).order(order || "id").range(from, from + 999)); out = out.concat(d); if (d.length < 1000) break; from += 1000; }
  return out;
}
async function logAct(action, detail) { try { await sb.from("activity_log").insert({ action: action, detail: String(detail || "").slice(0, 500) }); } catch (e) { console.warn(e); } }
function fullName(m) { return (m.first_name + " " + (m.last_name || "")).trim(); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function fmtDate(s) { if (!s) return "No date yet"; var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }); }
function fmtTime(t) { if (!t) return ""; var h = +t.slice(0, 2), m = t.slice(3, 5); return ((h % 12) || 12) + ":" + m + " " + (h < 12 ? "AM" : "PM"); }
function byName(a, b) { return fullName(a).toLowerCase().localeCompare(fullName(b).toLowerCase()); }
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function keepScroll(fn) { var y = window.scrollY; return Promise.resolve(fn()).then(function () { window.scrollTo(0, y); }); }
async function busy(btn, fn) { if (btn) btn.disabled = true; try { await fn(); } catch (e) { fail(e); } finally { if (btn && btn.isConnected) btn.disabled = false; } }

/* ---------- page shell ---------- */
var NAV = [["#/home", "Home", "/home"], ["#/calendar", "Calendar", "/calendar|/event"], ["#/members", "Members Roster", "/members|/member"],
  ["#/search", "Search Member Profile", "/search"], ["#/categories", "Categories", "/categories"], ["#/export", "Export", "/export"],
  ["#/activity", "Activity Log", "/activity"], ["#/users", "Users", "/users"]];
function shell(path, inner) {
  var links = NAV.map(function (n) {
    var on = n[2].split("|").some(function (p) { return path === p || path.indexOf(p + "/") === 0; });
    return '<a href="' + n[0] + '"' + (on ? ' class="active" aria-current="page"' : "") + ">" + esc(n[1]) + "</a>";
  }).join("");
  $("#app").innerHTML = '<header class="topbar"><div class="bar"><a class="brand" href="#/home">Ambassadors Portal</a>' +
    '<button class="menu-toggle" id="menutoggle" aria-expanded="false" aria-controls="nav">Menu</button>' +
    '<nav class="nav" id="nav">' + links + '<button id="logout">Log Out</button></nav></div></header><main class="page">' + inner + "</main>";
  $("#menutoggle").onclick = function () { var o = $("#nav").classList.toggle("open"); this.setAttribute("aria-expanded", o); };
  $("#logout").onclick = async function () { await sb.auth.signOut(); session = null; staff = null; go("#/login"); };
}
function plain(inner) { $("#app").innerHTML = '<main class="page">' + inner + "</main>"; }
function head(title, right) { return '<div class="row between wrap"><h1>' + esc(title) + "</h1><div class=\"row gap wrap\">" + (right || "") + "</div></div>"; }

/* ---------- auth screens ---------- */
function loginView(msg) {
  plain('<div class="card auth"><h1>Ambassadors Portal</h1><p class="muted">Officers and moderators only. Please log in.</p>' +
    (msg ? '<div class="flash">' + esc(msg) + "</div>" : "") + '<div id="err" class="flash bad" hidden></div>' +
    '<form id="f"><label class="field">Email<input type="email" name="email" autocomplete="username" required></label>' +
    '<label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>' +
    '<button class="btn primary block">Log In</button></form>' +
    '<p class="small"><button class="linklike" id="forgot">Forgot your password?</button></p></div>');
  var err = function (m) { var e = $("#err"); e.textContent = m; e.hidden = false; };
  $("#f").onsubmit = async function (ev) {
    ev.preventDefault(); var f = ev.target;
    var r = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (r.error) return err("That email and password did not match.");
    session = r.data.session; route();
  };
  $("#forgot").onclick = async function () {
    var email = $("#f").email.value.trim(); if (!email) return err("Type your email above first, then press this again.");
    await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    loginView("If that email has an account, a reset link is on its way. (It can take a few minutes. If it never comes, ask an officer to give you a new invite link.)");
  };
}
function recoveryView() {
  plain('<div class="card auth"><h1>Choose a new password</h1><div id="err" class="flash bad" hidden></div><form id="f">' +
    '<label class="field">New password <span class="muted">(at least ' + MIN_PW + ' characters)</span><input type="password" name="p1" autocomplete="new-password" minlength="' + MIN_PW + '" required></label>' +
    '<label class="field">Type it again<input type="password" name="p2" autocomplete="new-password" required></label><button class="btn primary block">Save password</button></form></div>');
  $("#f").onsubmit = async function (ev) {
    ev.preventDefault(); var f = ev.target, e = $("#err");
    if (f.p1.value.length < MIN_PW) { e.textContent = "Use at least " + MIN_PW + " characters."; e.hidden = false; return; }
    if (f.p1.value !== f.p2.value) { e.textContent = "The two passwords do not match."; e.hidden = false; return; }
    var r = await sb.auth.updateUser({ password: f.p1.value });
    if (r.error) { e.textContent = r.error.message; e.hidden = false; return; }
    recovering = false; history.replaceState(null, "", location.pathname); go("#/home");
  };
}
function joinView(code) {
  if (!code) return plain('<div class="card auth"><h1>Invite link</h1><p>This link is missing its code. Ask an officer to send it again.</p><p><a href="#/login">Go to log in</a></p></div>');
  plain('<div class="card auth"><h1>Create your login</h1><p class="muted">You were invited to the Ambassadors Portal. Pick the email and password you will use to log in.</p>' +
    '<div id="err" class="flash bad" hidden></div><form id="f"><label class="field">Email<input type="email" name="email" autocomplete="username" required></label>' +
    '<label class="field">Password <span class="muted">(at least ' + MIN_PW + ' characters)</span><input type="password" name="p1" autocomplete="new-password" minlength="' + MIN_PW + '" required></label>' +
    '<label class="field">Type it again<input type="password" name="p2" autocomplete="new-password" required></label>' +
    '<button class="btn primary block">Create my login</button></form></div>');
  $("#f").onsubmit = function (ev) {
    ev.preventDefault(); var f = ev.target, e = $("#err"), b = $("button", f);
    var bad = function (m) { e.textContent = m; e.hidden = false; };
    if (f.p1.value.length < MIN_PW) return bad("Use at least " + MIN_PW + " characters.");
    if (f.p1.value !== f.p2.value) return bad("The two passwords do not match.");
    busy(b, async function () {
      var email = f.email.value.trim(), r = await sb.auth.signUp({ email: email, password: f.p1.value });
      if (r.error) return bad(r.error.message);
      var s = r.data.session;
      if (!s) { var r2 = await sb.auth.signInWithPassword({ email: email, password: f.p1.value }); if (r2.error) return bad("Your account was created but could not log in yet. Ask the officer who invited you for help."); s = r2.data.session; }
      session = s;
      var c = await sb.rpc("claim_invite", { p_code: code });
      if (c.error) { await sb.auth.signOut(); session = null; return bad(c.error.message); }
      history.replaceState(null, "", location.pathname); go("#/home");
    });
  };
}
function deniedView() {
  plain('<div class="card auth"><h1>No access</h1><p>You are logged in as <strong>' + esc(session.user.email) + "</strong>, but this account is not an active officer or moderator.</p>" +
    '<p>If you were invited, open your invite link again. Otherwise ask an officer.</p><button class="btn" id="lo">Log Out</button></div>');
  $("#lo").onclick = async function () { await sb.auth.signOut(); session = null; go("#/login"); };
}

/* ---------- home ---------- */
async function homePage() {
  var d = await Promise.all([all("members", "id,status"), all("events", "id,title,event_date,start_time,location,setup_email,main_email,groupme", "id")]);
  var members = d[0], events = d[1], t = todayStr();
  var upcoming = events.filter(function (e) { return e.event_date && e.event_date >= t; }).sort(function (a, b) { return a.event_date.localeCompare(b.event_date); });
  var undated = events.filter(function (e) { return !e.event_date; });
  var flags = function (e) { return [["Set-up email", e.setup_email], ["Main email", e.main_email], ["GroupMe", e.groupme]].map(function (f) { return '<span class="badge ' + (f[1] ? "ok" : "warn") + '">' + f[0] + (f[1] ? " ✓" : " ✗") + "</span>"; }).join(" "); };
  shell("/home", '<div class="hero"><h1>Hello, ' + esc(staff.name) + '</h1><p class="lead">Welcome to the Ambassadors Portal.</p></div>' +
    '<div class="stats"><a class="card stat" href="#/members"><span class="num">' + members.filter(function (m) { return m.status === "active"; }).length + '</span>Active members</a>' +
    '<a class="card stat" href="#/calendar"><span class="num">' + upcoming.length + '</span>Upcoming events</a>' +
    '<a class="card stat" href="#/calendar"><span class="num">' + undated.length + '</span>Events needing a date</a>' +
    '<a class="card stat" href="#/members"><span class="num">' + members.filter(function (m) { return m.status === "guest"; }).length + '</span>Guests (not on roster)</a></div>' +
    '<div class="card"><div class="row between"><h2>Coming up</h2><a class="btn" href="#/event/new">Add Event</a></div>' +
    (upcoming.length ? '<ul class="list">' + upcoming.slice(0, 6).map(function (e) {
      return '<li><a href="#/event/' + e.id + '"><strong>' + esc(e.title) + "</strong></a> <span class=\"muted\">" + esc(fmtDate(e.event_date)) + " " + esc(fmtTime(e.start_time)) + "</span> " + flags(e) + "</li>";
    }).join("") + "</ul>" : '<p class="muted">No upcoming events yet. Use Add Event to put one on the calendar.</p>') + "</div>");
}

/* ---------- calendar ---------- */
function evChips(list) { return list.map(function (e) { return '<a class="chip-ev" href="#/event/' + e.id + '" title="' + esc(e.title) + '">' + esc((e.start_time ? fmtTime(e.start_time).replace(":00", "") + " " : "") + e.title) + "</a>"; }).join(""); }
async function calendarPage(params) {
  var events = await all("events", "id,title,event_date,start_time,location", "id"), t = todayStr();
  var m = params.get("m") || t.slice(0, 7); if (!/^\d{4}-\d{2}$/.test(m)) m = t.slice(0, 7);
  var y = +m.slice(0, 4), mo = +m.slice(5, 7), first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate();
  var shift = function (n) { var d = new Date(y, mo - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
  var byDay = {}; events.forEach(function (e) { if (e.event_date) (byDay[e.event_date] = byDay[e.event_date] || []).push(e); });
  Object.keys(byDay).forEach(function (k) { byDay[k].sort(function (a, b) { return (a.start_time || "").localeCompare(b.start_time || ""); }); });
  var cells = "", lead = first.getDay(), i;
  for (i = 0; i < lead; i++) cells += '<div class="cal-cell other"></div>';
  for (i = 1; i <= days; i++) { var ds = m + "-" + pad(i); cells += '<div class="cal-cell' + (ds === t ? " today" : "") + '"><a class="cal-day" href="#/event/new?date=' + ds + '" title="Add an event on this day">' + i + "</a>" + evChips(byDay[ds] || []) + "</div>"; }
  for (i = (lead + days) % 7; i && i < 7; i++) cells += '<div class="cal-cell other"></div>';
  var thisMonth = Object.keys(byDay).filter(function (k) { return k.slice(0, 7) === m; }).sort();
  var undated = events.filter(function (e) { return !e.event_date; });
  shell("/calendar", head("Calendar", '<a class="btn primary" href="#/event/new">Add Event</a>') +

function download(name, rows) {
  var blob = new Blob(["﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}
async function exportPage() {
  shell("/export", head("Export") + '<p class="muted">Downloads open in Excel or Google Sheets.</p><div class="card"><div class="row gap wrap">' +
    '<button class="btn primary" data-x="members">Members roster (.csv)</button><button class="btn primary" data-x="events">Events (.csv)</button><button class="btn primary" data-x="attendance">Attendance, every event (.csv)</button></div></div>');
  $$("[data-x]").forEach(function (b) { b.onclick = function () { var what = b.dataset.x; busy(b, async function () {
    var d = await Promise.all([all("members", "*", "id"), all("events", "*", "id"), all("signups", "*", "event_id"), all("categories", "id,name", "id"), all("member_categories", "*", "member_id")]);
    var members = d[0].sort(byName), events = d[1], sus = d[2], cats = d[3], mc = {}, mById = {}, eById = {};
    d[4].forEach(function (r) { mc[r.member_id + ":" + r.category_id] = r.value; }); members.forEach(function (m) { mById[m.id] = m; }); events.forEach(function (e) { eById[e.id] = e; });
    if (what === "members") {
      var n = {}; sus.forEach(function (s) { if (s.attended) n[s.member_id] = (n[s.member_id] || 0) + 1; });
      download("members.csv", [["First name", "Last name", "Position", "On roster", "Email", "Phone", "Reminder email", "Events attended", "Notes"].concat(cats.map(function (c) { return c.name; }))].concat(members.map(function (m) {
        return [m.first_name, m.last_name, m.position, m.status === "guest" ? "Guest" : "Active", m.email, m.phone, REMINDER[m.reminder_status], n[m.id] || 0, m.notes].concat(cats.map(function (c) { return mc[m.id + ":" + c.id] || ""; })); })));
    } else if (what === "events") {
      var c = {}; sus.forEach(function (s) { if (s.attended) c[s.event_id] = (c[s.event_id] || 0) + 1; });
      download("events.csv", [["Event", "Date", "Start time", "Where", "Notes", "Set-up email sent", "Main email sent", "GroupMe sent", "Attended"]].concat(events.sort(function (a, b) { return (a.event_date || "9999").localeCompare(b.event_date || "9999"); }).map(function (e) {
        return [e.title, e.event_date || "", fmtTime(e.start_time), e.location, e.description, e.setup_email ? "Yes" : "No", e.main_email ? "Yes" : "No", e.groupme ? "Yes" : "No", c[e.id] || 0]; })));
    } else {
      download("attendance.csv", [["Event", "Date", "Member", "Role", "Present", "Note"]].concat(sus.filter(function (s) { return eById[s.event_id] && mById[s.member_id]; }).map(function (s) {
        return [eById[s.event_id].title, eById[s.event_id].event_date || "", fullName(mById[s.member_id]), ROLES[s.role], s.attended ? "Yes" : "No", s.note]; })));
    }
    await logAct("Exported", what); }); }; });
}

/* ---------- activity log ---------- */
async function activityPage() {
  var page = 0, size = 100;
  shell("/activity", head("Activity Log") + '<p class="muted">Every change made in the portal. Entries cannot be edited or deleted.</p><div class="card table-wrap"><table class="table"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody id="lb"></tbody></table></div><p><button class="btn" id="more">Show older</button></p>');
  var load = async function () {
    var rows = await q(sb.from("activity_log").select("*").order("id", { ascending: false }).range(page * size, page * size + size - 1));
    $("#lb").insertAdjacentHTML("beforeend", rows.map(function (r) { return "<tr><td class=\"nowrap\">" + esc(new Date(r.created_at).toLocaleString()) + "</td><td>" + esc(r.user_name) + "</td><td>" + esc(r.action) + "</td><td>" + esc(r.detail) + "</td></tr>"; }).join(""));
    if (rows.length < size) $("#more").hidden = true; page++;
  };
  $("#more").onclick = function () { busy(this, load); }; await load();
}

/* ---------- users ---------- */
function joinLink(code) { return location.origin + location.pathname + "#/join?code=" + code; }
async function usersPage(newLink) {
  var rows = await q(sb.from("staff").select("id,user_id,email,name,role,active,invite_expires,created_at").order("id")), now = Date.now();
  var status = function (s) { return !s.user_id ? ((s.invite_expires && new Date(s.invite_expires) > now) ? '<span class="badge warn">Invite waiting</span>' : '<span class="badge warn">Invite expired</span>') : (s.active ? '<span class="badge ok">Active</span>' : '<span class="badge">Turned off</span>'); };
  shell("/users", head("Users", '<a class="btn" href="#/account">My account</a>') + '<p class="muted">Only people listed here can log in. Officers and moderators have the same access.</p>' +
    (newLink ? '<div class="card link-card"><h2>Invite link for ' + esc(newLink.name) + '</h2><p>Send this link to them yourself (text, GroupMe or email). It works once and expires in 7 days. <strong>It will not be shown again.</strong></p><input class="copy" id="lnk" readonly value="' + esc(joinLink(newLink.code)) + '"><p><button class="btn" id="cp">Copy link</button></p></div>' : "") +
    '<div class="card"><h2>Add a user</h2><form id="uf" class="row gap wrap end"><label class="field" style="flex:1 1 220px;margin:0">Their name<input name="name" maxlength="80" required></label>' +
    '<label class="field" style="margin:0">Title<select name="role"><option value="officer">Officer</option><option value="moderator">Moderator</option></select></label><button class="btn primary">Create invite link</button></form></div>' +
    '<div class="card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Title</th><th>Login email</th><th>Status</th><th></th></tr></thead><tbody>' + rows.map(function (s) {
      var me = s.id === staff.id;
      return '<tr data-id="' + s.id + '"><td>' + esc(s.name) + (me ? ' <span class="badge">You</span>' : "") + '</td><td><select data-role aria-label="Title">' + opts({ officer: "Officer", moderator: "Moderator" }, s.role) + "</select></td><td>" + esc(s.email || "") + "</td><td>" + status(s) +
        '</td><td class="nowrap">' + (!s.user_id ? '<button class="btn small" data-reissue>New link</button> ' : (me ? "" : '<button class="btn small" data-toggle>' + (s.active ? "Turn off" : "Turn on") + "</button> ")) + (me ? "" : '<button class="btn small danger" data-rm>Remove</button>') + "</td></tr>"; }).join("") + "</tbody></table></div>");
  if (newLink) { $("#cp").onclick = function () { $("#lnk").select(); (navigator.clipboard ? navigator.clipboard.writeText($("#lnk").value) : Promise.reject()).then(function () { toast("Copied"); }, function () { toast("Press Ctrl+C / long-press to copy"); }); }; $("#lnk").onclick = function () { this.select(); }; }
  $("#uf").onsubmit = function (e) { e.preventDefault(); busy($("button", e.target), async function () {
    var name = e.target.name.value.trim(), code = await q(sb.rpc("create_invite", { p_name: name, p_role: e.target.role.value })); await logAct("Created invite", name); await usersPage({ name: name, code: code }); }); };
  $$("tbody tr[data-id]").forEach(function (tr) {
    var id = +tr.dataset.id, s = rows.filter(function (r) { return r.id === id; })[0];
    $("[data-role]", tr).onchange = function () { var v = this.value; busy(null, async function () { await q(sb.from("staff").update({ role: v }).eq("id", id)); await logAct("Changed user title", s.name + " → " + v); toast("Saved"); }); };
    var t = $("[data-toggle]", tr); if (t) t.onclick = function () { busy(this, async function () { await q(sb.from("staff").update({ active: !s.active }).eq("id", id)); await logAct(s.active ? "Turned off user" : "Turned on user", s.name); await route(); }); };
    var r = $("[data-reissue]", tr); if (r) r.onclick = function () { busy(this, async function () { var code = await q(sb.rpc("reissue_invite", { p_staff_id: id })); await logAct("Reissued invite", s.name); await usersPage({ name: s.name, code: code }); }); };
    var d = $("[data-rm]", tr); if (d) d.onclick = function () { if (!confirm("Remove " + s.name + "? They will no longer be able to log in.")) return; busy(this, async function () { await q(sb.from("staff").delete().eq("id", id)); await logAct("Removed user", s.name); await route(); }); };
  });
}
function accountPage() {
  shell("/account", head("My account") + '<div class="card narrow"><p>Logged in as <strong>' + esc(staff.name) + "</strong> (" + esc(staff.role) + ") · " + esc(session.user.email) + '</p><h2>Change password</h2><div id="err" class="flash bad" hidden></div>' +
    '<form id="f"><label class="field">New password <span class="muted">(at least ' + MIN_PW + ' characters)</span><input type="password" name="p1" autocomplete="new-password" required></label><label class="field">Type it again<input type="password" name="p2" autocomplete="new-password" required></label><button class="btn primary">Save password</button></form></div>');
  $("#f").onsubmit = function (ev) { ev.preventDefault(); var f = ev.target, e = $("#err");
    if (f.p1.value.length < MIN_PW) { e.textContent = "Use at least " + MIN_PW + " characters."; e.hidden = false; return; }
    if (f.p1.value !== f.p2.value) { e.textContent = "The two passwords do not match."; e.hidden = false; return; }
    busy($("button", f), async function () { var r = await sb.auth.updateUser({ password: f.p1.value }); if (r.error) { e.textContent = r.error.message; e.hidden = false; return; } e.hidden = true; f.reset(); await logAct("Changed own password", staff.name); toast("Password changed"); }); };
}

/* ---------- router ---------- */
var routing = 0;
async function route() {
  var my = ++routing, h = location.hash.replace(/^#/, "") || "/home", i = h.indexOf("?");
  var path = i < 0 ? h : h.slice(0, i), params = new URLSearchParams(i < 0 ? "" : h.slice(i + 1)), parts = path.split("/").filter(Boolean);
  try {
    if (path === "/join") return joinView(params.get("code"));
    if (recovering) return recoveryView();
    if (!session) return loginView();
    if (!staff || staff.user_id !== session.user.id) {
      var rows = await q(sb.from("staff").select("id,user_id,email,name,role,active,invite_expires,created_at").eq("user_id", session.user.id));
      staff = rows[0] && rows[0].active ? rows[0] : null;
    }
    if (!staff) return deniedView();
    if (my !== routing) return;
    var page = parts[0], arg = parts[1];
    if (page === "login") return go("#/home");
    var pages = { home: homePage, calendar: function () { return calendarPage(params); }, members: rosterPage, search: function () { return searchPage(params); }, categories: categoriesPage,
      export: exportPage, activity: activityPage, users: function () { return usersPage(); }, account: accountPage, event: function () { return arg ? eventPage(arg, params) : go("#/calendar"); }, member: function () { return arg ? memberPage(arg) : go("#/members"); } };
    await (pages[page] || homePage)(); window.scrollTo(0, 0);
  } catch (e) {
    console.error(e); if (my === routing) { plain('<div class="card"><h2>Something went wrong</h2><p>' + esc(e.message || e) + '</p><p><a href="#/home">Back to home</a> · <button class="linklike" onclick="location.reload()">Try again</button></p></div>'); }
  }
}

(async function start() {
  if (/PASTE_YOUR/.test(SUPABASE_URL + SUPABASE_KEY) || !window.supabase) {
    plain('<div class="card auth"><h1>Almost ready</h1><p>' + (window.supabase ? "Open <code>index.html</code> and paste your Supabase Project URL and publishable key at the top of the script (see SETUP.md)." : "The login library could not load. Check your internet connection and refresh.") + "</p></div>"); return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(function (ev, s) {
    session = s || null; if (ev === "PASSWORD_RECOVERY") recovering = true;
    if (ev === "SIGNED_OUT") { staff = null; gmConfigured = null; }
    setTimeout(route, 0);
  });
  var r = await sb.auth.getSession(); session = r.data.session; window.addEventListener("hashchange", route); route();
})();
</script>
